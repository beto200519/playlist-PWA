<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1db954">
  <meta name="description" content="Puras Pa Pistiar - PWA">
  <title>Puras Pa Pistiar</title>
  <link rel="manifest" href="Manifest.webmanifest">
  <link rel="icon" type="image/png" href="icono2.png">
  <link href="App.css" rel="stylesheet">
</head>
<body>
  <!-- HEADER -->
  <header class="topbar">
    <div class="brand">
      <h1>🎵 Puras Pa Pistiar</h1>
      <p class="alumno">Alumno: <strong>Norberto Carrillo Leyva</strong></p>
    </div>
    <button id="btnPlaylist" class="btn-playlist" title="Mi playlist">
      📋 <span id="contador">0</span>
    </button>
  </header>

  <!-- BANNER OFFLINE -->
  <div id="status-banner" class="online">✅ En línea</div>

  <!-- BUSCADOR -->
  <div class="search-wrap">
    <input id="buscador" type="search" placeholder="🔍 Buscar canción, artista o álbum...">
  </div>

  <!-- CHIPS DE GÉNEROS -->
  <section class="chips" id="chipsGeneros"></section>

  <!-- ARTISTAS DESTACADOS -->
  <section class="section">
    <h2>🎤 Artistas</h2>
    <div class="artistas" id="artistas"></div>
  </section>

  <!-- RECOMENDADAS -->
  <section class="section">
    <h2 id="tituloRecomendadas">🔥 Recomendadas</h2>
    <div class="grid" id="lista"></div>
  </section>

  <!-- MODAL CANCIÓN -->
  <div class="modal-overlay" id="modalCancion" hidden>
    <div class="modal modal-song">
      <button class="modal-close" data-close="modalCancion">✕</button>
      <div class="song-portada" id="songPortada">
        <span id="songIniciales">?</span>
      </div>
      <h2 id="songTitulo"></h2>
      <p class="song-artista" id="songArtista"></p>
      <p class="song-album" id="songAlbum"></p>
      <div class="player">
        <button id="btnPlay" class="btn-play">▶</button>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="time" id="time">0:00</span>
      </div>
      <button id="btnAgregar" class="btn-agregar">➕ Agregar a mi playlist</button>
    </div>
  </div>

  <!-- MODAL PLAYLIST -->
  <div class="modal-overlay" id="modalPlaylist" hidden>
    <div class="modal modal-playlist">
      <button class="modal-close" data-close="modalPlaylist">✕</button>
      <h2>📋 Mi Playlist</h2>
      <div id="playlistItems"></div>
      <button id="btnVaciar" class="btn-vaciar">🗑️ Vaciar playlist</button>
    </div>
  </div>

  <script src="App.js"></script>
</body>
</html>
